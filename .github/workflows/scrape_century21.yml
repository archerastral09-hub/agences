name: Scrape Century 21 (SIREN, email, dirigeants)

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Nombre d'agences à traiter (0 = toutes, mets 10 pour tester)"
        default: "0"
      workers:
        description: "Threads pour les pages mentions légales"
        default: "8"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer tesseract (OCR de l'email)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-fra

      - name: Installer les dépendances Python
        run: pip install requests beautifulsoup4 openpyxl pytesseract pillow

      - name: Lancer le scraping
        run: |
          python -u scrape_century21.py \
            --input agences_century21.xlsx \
            --output output/agences_century21_complete.xlsx \
            --limit "${{ github.event.inputs.limit }}" \
            --workers "${{ github.event.inputs.workers }}"

      - name: Publier le fichier résultat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agences_century21_complete
          path: output/agences_century21_complete.xlsx
